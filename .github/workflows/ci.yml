name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Verify frontend
        working-directory: web
        run: |
          npm audit --audit-level=high
          npm run typecheck
          npm test
          npm run build

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test Go code
        run: go test ./...

      - name: Vet Go code
        run: go vet ./...

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build mission appliance
        run: docker build --tag keelmesh/core:ci .

      - name: Run API smoke test
        run: |
          docker run --detach --name keelmesh-ci --publish 8080:8080 keelmesh/core:ci
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:8080/readyz && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8080/api/v1/bootstrap | grep '"schema_version":1'

      - name: Verify M1 and M2 API contracts
        run: |
          python3 scripts/verify_m1.py http://127.0.0.1:8080
          python3 scripts/verify_m2.py http://127.0.0.1:8080

      - name: Run browser mission loop
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Show service logs on failure
        if: failure()
        run: docker logs keelmesh-ci || true

  scale-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Render production-shape manifests
        run: |
          docker run --rm -v "$PWD":/work registry.k8s.io/kustomize/kustomize:v5.7.1 build /work/deploy/kubernetes/base >/tmp/keelmesh-base.yaml
          docker run --rm -v "$PWD":/work registry.k8s.io/kustomize/kustomize:v5.7.1 build /work/deploy/kubernetes/aws >/tmp/keelmesh-aws.yaml
          test "$(grep -c 'kind: Deployment' /tmp/keelmesh-base.yaml)" -eq 4
          test "$(grep -c 'kind: Deployment' /tmp/keelmesh-aws.yaml)" -eq 4

      - name: Start measured scale appliance
        run: |
          docker compose up --detach --build
          for attempt in {1..60}; do
            workers=$(curl --silent http://127.0.0.1:8080/api/v1/platform | python3 -c 'import json,sys; print(len([w for w in json.load(sys.stdin).get("workers",[]) if w["state"]=="running"]))' 2>/dev/null || echo 0)
            test "$workers" -eq 3 && break
            sleep 2
          done
          test "$workers" -eq 3

      - name: Verify M3 failure, recovery, quarantine, and replay
        run: python3 scripts/verify_m3.py http://127.0.0.1:8080 --json m3-evidence.json --markdown m3-evidence.md

      - name: Upload M3 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m3-evidence
          path: |
            m3-evidence.json
            m3-evidence.md
          if-no-files-found: ignore

      - name: Show scale service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
