name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Verify frontend
        working-directory: web
        run: |
          npm audit --audit-level=high
          npm run typecheck
          npm test
          npm run build

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test Go code
        run: go test ./...

      - name: Vet Go code
        run: go vet ./...

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build mission appliance
        run: docker build --tag keelmesh/core:ci .

      - name: Run API smoke test
        run: |
          docker run --detach --name keelmesh-ci --publish 8080:8080 keelmesh/core:ci
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:8080/readyz && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8080/api/v1/bootstrap | grep '"schema_version":1'

      - name: Run browser mission loop
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Show service logs on failure
        if: failure()
        run: docker logs keelmesh-ci || true
