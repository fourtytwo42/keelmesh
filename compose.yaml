name: keelmesh

services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
    image: keelmesh/core:bootstrap
    restart: unless-stopped
    ports:
      - "${KEELMESH_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

