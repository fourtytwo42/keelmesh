name: keelmesh

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: keelmesh
      POSTGRES_USER: keelmesh
      POSTGRES_PASSWORD: keelmesh
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keelmesh -d keelmesh"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.2.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    build: &app-build
      context: .
      dockerfile: Dockerfile
    image: keelmesh/core:m6
    command: ["--role", "migrate"]
    environment: &app-env
      KEELMESH_DATABASE_URL: postgres://keelmesh:keelmesh@postgres:5432/keelmesh?sslmode=disable
      KEELMESH_KAFKA_BROKERS: kafka:9092
      KEELMESH_CONTROL_SECRET: local-m3-signed-control
      KEELMESH_AI_URL: http://ai:8090
      KEELMESH_CORE_AI_TOKEN_FILE: /run/keelmesh-auth/core-ai/token
      KEELMESH_MCP_INVESTIGATOR_TOKEN_FILE: /run/keelmesh-auth/investigator/token
      KEELMESH_MCP_SEEDER_TOKEN_FILE: /run/keelmesh-auth/seeder/token
      KEELMESH_SPEECH_URL: http://speech:8091
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  topic-init:
    image: keelmesh/core:m6
    command: ["--role", "topic-init"]
    environment: *app-env
    depends_on:
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  loadgen-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 100:101 /data"]
    volumes:
      - loadgen-data:/data
    restart: "no"

  ai-auth-init:
    image: alpine:3.22
    command:
      - sh
      - -euc
      - |
        umask 077
        test -s /investigator/token || head -c 32 /dev/urandom | base64 > /investigator/token
        test -s /seeder/token || head -c 32 /dev/urandom | base64 > /seeder/token
        test -s /core-ai/token || head -c 32 /dev/urandom | base64 > /core-ai/token
        cp /run/secrets/openrouter_api_key /openrouter/token
        chmod 0444 /investigator/token /seeder/token /core-ai/token
        chown 10001:10001 /openrouter/token
        chmod 0400 /openrouter/token
    volumes:
      - mcp-investigator-token:/investigator
      - mcp-seeder-token:/seeder
      - core-ai-token:/core-ai
      - openrouter-runtime:/openrouter
    secrets:
      - openrouter_api_key
    restart: "no"

  core:
    build: *app-build
    image: keelmesh/core:m6
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
      ai-auth-init:
        condition: service_completed_successfully
    volumes:
      - core-ai-token:/run/keelmesh-auth/core-ai:ro
      - mcp-investigator-token:/run/keelmesh-auth/investigator:ro
      - mcp-seeder-token:/run/keelmesh-auth/seeder:ro
    ports:
      - "${KEELMESH_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  loadgen:
    image: keelmesh/core:m6
    command: ["--role", "loadgen"]
    environment: *app-env
    volumes:
      - loadgen-data:/data
    depends_on:
      topic-init:
        condition: service_completed_successfully
      loadgen-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-1: &worker
    image: keelmesh/core:m6
    command: ["--role", "worker-supervisor"]
    environment:
      <<: *app-env
      KEELMESH_WORKER_ID: worker-1
    depends_on:
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-2:
    <<: *worker
    environment:
      <<: *app-env
      KEELMESH_WORKER_ID: worker-2

  worker-3:
    <<: *worker
    environment:
      <<: *app-env
      KEELMESH_WORKER_ID: worker-3

  ai-index:
    build:
      context: .
      dockerfile: Dockerfile.ai
    image: keelmesh/ai:m5
    command: ["python", "-m", "keelmesh_ai.index"]
    depends_on:
      ai-auth-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=32m
    restart: "no"

  ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    image: keelmesh/ai:m5
    restart: unless-stopped
    environment:
      OPENROUTER_API_KEY_FILE: /run/keelmesh-auth/openrouter/token
      KEELMESH_CORE_AI_TOKEN_FILE: /run/keelmesh-auth/core-ai/token
      KEELMESH_MCP_INVESTIGATOR_TOKEN_FILE: /run/keelmesh-auth/investigator/token
      KEELMESH_MCP_URL: http://core:8081/mcp
      KEELMESH_LOCAL_BASE_URL: ${KEELMESH_LOCAL_BASE_URL:-}
      KEELMESH_LOCAL_MODEL: ${KEELMESH_LOCAL_MODEL:-}
      KEELMESH_PROVIDER_MODE: ${KEELMESH_PROVIDER_MODE:-connected}
    volumes:
      - core-ai-token:/run/keelmesh-auth/core-ai:ro
      - mcp-investigator-token:/run/keelmesh-auth/investigator:ro
      - openrouter-runtime:/run/keelmesh-auth/openrouter:ro
    depends_on:
      core:
        condition: service_healthy
      ai-index:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  speech:
    build:
      context: .
      dockerfile: Dockerfile.speech
    image: keelmesh/speech:m6
    restart: unless-stopped
    volumes:
      - ./.keelmesh-models/pocket-tts:/models:ro
      - ./.keelmesh-models/stt/faster-whisper-tiny.en:/stt-model:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8091/healthz'))['status'] in ('ready','degraded')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  kafka-data:
  loadgen-data:
  mcp-investigator-token:
  mcp-seeder-token:
  core-ai-token:
  openrouter-runtime:

secrets:
  openrouter_api_key:
    file: ${OPENROUTER_API_KEY_FILE:-/etc/keelmesh/secrets/openrouter_api_key}
