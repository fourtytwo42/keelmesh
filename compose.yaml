name: keelmesh

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: keelmesh
      POSTGRES_USER: keelmesh
      POSTGRES_PASSWORD: keelmesh
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keelmesh -d keelmesh"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.2.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    build: &app-build
      context: .
      dockerfile: Dockerfile
    image: keelmesh/core:m3
    command: ["--role", "migrate"]
    environment: &app-env
      KEELMESH_DATABASE_URL: postgres://keelmesh:keelmesh@postgres:5432/keelmesh?sslmode=disable
      KEELMESH_KAFKA_BROKERS: kafka:9092
      KEELMESH_CONTROL_SECRET: local-m3-signed-control
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  topic-init:
    image: keelmesh/core:m3
    command: ["--role", "topic-init"]
    environment: *app-env
    depends_on:
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  loadgen-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 100:101 /data"]
    volumes:
      - loadgen-data:/data
    restart: "no"

  core:
    build: *app-build
    image: keelmesh/core:m3
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
    ports:
      - "${KEELMESH_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  loadgen:
    image: keelmesh/core:m3
    command: ["--role", "loadgen"]
    environment: *app-env
    volumes:
      - loadgen-data:/data
    depends_on:
      topic-init:
        condition: service_completed_successfully
      loadgen-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-1: &worker
    image: keelmesh/core:m3
    command: ["--role", "worker-supervisor"]
    environment:
      <<: *app-env
      KEELMESH_WORKER_ID: worker-1
    depends_on:
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-2:
    <<: *worker
    environment:
      <<: *app-env
      KEELMESH_WORKER_ID: worker-2

  worker-3:
    <<: *worker
    environment:
      <<: *app-env
      KEELMESH_WORKER_ID: worker-3

volumes:
  postgres-data:
  kafka-data:
  loadgen-data:
