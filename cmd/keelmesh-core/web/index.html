<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KeelMesh Mission Appliance</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #e8f0f2; background: radial-gradient(circle at 70% 20%, #173c45, #081317 58%); }
    main { width: min(720px, calc(100% - 32px)); padding: 32px; border: 1px solid #2b4a52; border-radius: 18px; background: rgba(8, 19, 23, .88); box-shadow: 0 24px 70px rgba(0, 0, 0, .35); }
    .eyebrow { color: #7fd4c5; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 10px 0 12px; font-size: clamp(30px, 6vw, 54px); line-height: 1; }
    p { color: #aac0c5; line-height: 1.6; }
    .status { display: flex; align-items: center; gap: 10px; margin-top: 24px; padding: 14px 16px; border-radius: 12px; background: #10272d; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #51d88a; box-shadow: 0 0 16px #51d88a; }
    code { color: #d8f7ef; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Mission appliance bootstrap</div>
    <h1>KeelMesh is online.</h1>
    <p>Program the mission once. Coordinate locally. Adapt together. Degrade safely when the uplink disappears.</p>
    <div class="status"><span class="dot"></span><span><code>keelmesh-core</code> is ready for deployment.</span></div>
  </main>
</body>
</html>
