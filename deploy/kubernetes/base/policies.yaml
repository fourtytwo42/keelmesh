apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: keelmesh-default-deny}
spec: {podSelector: {matchLabels: {app.kubernetes.io/name: keelmesh}}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: keelmesh-allowed-paths}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: keelmesh}}
  policyTypes: [Ingress, Egress]
  ingress:
  - ports: [{protocol: TCP, port: 8080}]
  egress:
  - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}, {protocol: TCP, port: 9092}, {protocol: TCP, port: 5432}]
