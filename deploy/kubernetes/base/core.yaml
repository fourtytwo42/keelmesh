apiVersion: apps/v1
kind: Deployment
metadata: {name: keelmesh-core, labels: {app.kubernetes.io/name: keelmesh, app.kubernetes.io/component: core}}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/component: core}}
  template:
    metadata: {labels: {app.kubernetes.io/name: keelmesh, app.kubernetes.io/component: core}}
    spec:
      serviceAccountName: keelmesh
      containers:
      - name: core
        image: ghcr.io/fourtytwo42/keelmesh:latest
        args: ["--role", "core"]
        envFrom: [{configMapRef: {name: keelmesh-platform}}, {secretRef: {name: keelmesh-control}}]
        ports: [{name: http, containerPort: 8080}, {name: mcp, containerPort: 8081}]
        readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
        resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      topologySpreadConstraints:
      - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/component: core}}}
---
apiVersion: v1
kind: Service
metadata: {name: keelmesh-core}
spec: {selector: {app.kubernetes.io/component: core}, ports: [{name: http, port: 80, targetPort: http}, {name: mcp, port: 8081, targetPort: mcp}]}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: keelmesh}
automountServiceAccountToken: false
