apiVersion: apps/v1
kind: Deployment
metadata: {name: keelmesh-worker, labels: {app.kubernetes.io/name: keelmesh, app.kubernetes.io/component: worker}}
spec:
  replicas: 3
  selector: {matchLabels: {app.kubernetes.io/component: worker}}
  template:
    metadata: {labels: {app.kubernetes.io/name: keelmesh, app.kubernetes.io/component: worker}}
    spec:
      serviceAccountName: keelmesh
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - {weight: 100, podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app.kubernetes.io/component: worker}}}}
      topologySpreadConstraints:
      - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/component: worker}}}
      containers:
      - name: worker
        image: ghcr.io/fourtytwo42/keelmesh:latest
        args: ["--role", "worker-supervisor"]
        envFrom: [{configMapRef: {name: keelmesh-platform}}, {secretRef: {name: keelmesh-control}}]
        env: [{name: KEELMESH_WORKER_ID, valueFrom: {fieldRef: {fieldPath: metadata.name}}}]
        livenessProbe: {exec: {command: [sh, -c, "test -d /proc/1"]}, periodSeconds: 10}
        resources: {requests: {cpu: 500m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: keelmesh-worker}
spec: {minAvailable: 2, selector: {matchLabels: {app.kubernetes.io/component: worker}}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: keelmesh-worker}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: keelmesh-worker}
  minReplicas: 3
  maxReplicas: 30
  metrics:
  - type: External
    external: {metric: {name: keelmesh_kafka_consumer_lag}, target: {type: AverageValue, averageValue: "1000"}}
  behavior: {scaleDown: {stabilizationWindowSeconds: 300}, scaleUp: {stabilizationWindowSeconds: 15}}
